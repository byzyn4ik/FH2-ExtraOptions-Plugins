; Keyboard & Mouse for Forza Horizon 2 (Extra Options plugin)
; Read when the game starts. The KEYBOARD & MOUSE page (pause menu > Settings)
; writes the options and keys below and applies them at once.
; An unknown key, a bad value or one key on two actions of the same group
; (driving, or menus) refuses [KeyboardMouse]: keyboard & mouse then stays off
; and FH2_ExtraOptions.log says which line.

[KeyboardMouse]
; 1: play with keyboard and mouse (the game's own input actions; a gamepad
; keeps working). 0: nothing is installed.
Enabled=1
; Auto: follows the device used last. KBM: keyboard & mouse only.
; PAD: the gamepad path is left untouched (no input hooks; restart to change).
Mode=Auto
; The mouse turns the driving look camera; MouseLookPitch also tilts it up and
; down in the bumper, hood, cockpit and driver views.
MouseLook=1
MouseLookPitch=0
InvertMouseY=0
; Keep the pointer inside the window while the mouse steers the view.
MouseCapture=1
; Look speed (1-2000), recentring delay in ms (0-60000) and speed (10-3600).
MouseSensitivity=80
MouseReturnDelay=1200
MouseReturnSpeed=240
; Keyboard steering speed in percent (25-400); InvertSteering swaps A and D.
SteeringSpeed=100
InvertSteering=0
; Esc pauses in the world and goes back everywhere else.
Escape=1
; A pointer in menus, the map, photo mode and the car viewer: click chooses,
; right click goes back, the wheel scrolls. Size and map speed in percent.
MenuCursor=1
CursorSize=250
MapCursorSpeed=400
; Arrow keys in menus: Stick (the left stick; Numpad 8/2/4/6 are the D-pad)
; or DPad (the other way round).
MenuArrows=Stick
; 1: logs every key and mouse event (diagnostics).
Trace=0

; Keys: up to three per action, comma separated (Throttle=W,Up), or None.
; Names: A-Z, 0-9, F1, F3-F7, F9-F12, Minus, Equals, Backspace, Tab,
; LeftBracket, RightBracket, Enter, LCtrl, RCtrl, LShift, RShift, Semicolon,
; Apostrophe, Grave, Backslash, Comma, Period, Slash, Space, CapsLock,
; Up, Down, Left, Right, Home, End, PageUp, PageDown, Insert, Delete,
; Numpad0-Numpad9, NumpadPlus, NumpadMinus, NumpadMultiply, NumpadDivide,
; NumpadDecimal, NumpadEnter. Esc, F2, F8, Alt and Windows keys are not bindable.
; Keys are physical (they stay put with any keyboard layout).
; Extra Options 0.4.4 uses F1 (hide UI), F2 (Autodrive), F3 (headlights),
; F4 (roof) and Tab (jump to manufacturer in car lists) itself: the defaults
; below avoid them where they would clash, and the log warns about a key
; that both would act on.
; Uncomment a line to change it; a missing line keeps the default shown.
;Throttle=W
;Brake=S
;SteerLeft=A
;SteerRight=D
;Handbrake=Space
;ShiftUp=E
;ShiftDown=Q
;Clutch=LShift
;Camera=Tab
;Rewind=R
;LookBack=Down,B
;Activate=Enter,F,X
;PhotoMode=P
;RadioPrevious=Left
;RadioNext=Right
; Menus and HUD
;Map=M
;Pause=None
;Confirm=Enter
;Back=None
;Up=Up
;Down=Down
;Left=Left
;Right=Right
;TabLeft=Q
;TabRight=E
;MenuX=X
;MenuY=Y
;MenuLeftTrigger=PageUp
;MenuRightTrigger=PageDown
;DPadUp=Numpad8
;DPadDown=Numpad2
;DPadLeft=Numpad4
;DPadRight=Numpad6

[Controller]
; 1: the game's "controller disconnected" pause fires only when a pad that was
; connected is unplugged, not again on every close of the pause menu while no
; pad is paired. Works without keyboard & mouse too. 0: the game's own rule
; (keyboard & mouse still skips it while it is in use with no pad attached).
PauseOnlyOnUnplug=1
