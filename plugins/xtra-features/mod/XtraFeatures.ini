; Xtra Features for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts. A value out of range turns its feature off
; (the log, FH2_ExtraOptions.log, says which line).

[XtraFeatures]
; 1: the pause (world) map opens farther out and zooms out farther ([MapZoom]).
MapZoom=1
; 1: garage thumbnails (My Cars, the car strip) rendered larger
; ([GarageThumbnails]); F8 re-renders the thumbnails of every painted car.
GarageThumbnails=1
; 1: RB in photo mode (camera or hidden-UI view) credits the cars in view to
; the photo collection, as after a real photo, without taking one.
PhotoScan=1
; 1: an Exit Game tile on the pause menu's Home tab (beside Online Road Trip,
; made square) that closes the game.
ExitGame=1

[MapZoom]
; In percent of the game's own distances (the mainland map opens at, and
; zooms out to, 2500 m; Storm Island 1100 m). 100 = the game's value.
; Opening distance: 25-400. Farthest zoom-out: 100-400.
MapStartZoom=150
MapMaxZoomOut=225
MapIslandStartZoom=100
MapIslandMaxZoomOut=175

[GarageThumbnails]
; Thumbnails at 2, 3 or 4 times the console's size (816x459 and 192x108);
; 2 is pixel for pixel in the My Cars panel at 2160p. 1: the console's size
; (F8 still re-renders). Applies to thumbnails made after the game starts
; (a car bought, painted or upgraded) and to F8.
CarPreviewScale=3
