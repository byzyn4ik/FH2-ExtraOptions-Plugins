; Saves in Documents (mirror) for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts.
;
; The game keeps its saves where Azimuth puts them (data\titles\1A96545B\saves
; beside Azimuth.exe). This plugin copies every new save into Folder and checks
; the copy (SHA-256). It only reads the game's saves and never writes there.

[DocumentsSaves]
; 1: copy the saves. 0: the plugin does nothing.
Enabled=1

; The copy. Empty: Documents\My Games\Forza Horizon 2\Saves\1A96545B.
; A full path; environment variables work.
Folder=

; 0: every save ever copied is kept (a profile save is about 6.5 MB).
; 2 or more: per save (profile, photo, livery ...), only that many of the
; newest copies are kept; older copies in Folder are removed.
KeepRevisions=0
