; Photo Export for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts.

[PhotoExport]
; 1: every photo taken in the game is copied once, as a JPG, into Folder.
; 0: the plugin does nothing.
Enabled=1

; Where the JPG files go. Empty: Documents\My Games\Forza Horizon 2\Photos.
; A full path; environment variables work, e.g.
; Folder=%USERPROFILE%\Pictures\Forza Horizon 2
Folder=
