; Azimuth Graphics Options for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts. An empty value means the default.

[Graphics]
; 1: Azimuth's graphics settings as rows of the game's Video settings page.
Enabled=1
; 1: frame rate, display mode, shadow distance / update rate and volume apply
; at once (where Azimuth and the game are as inspected); 0: every change
; applies after a restart.
LiveApply=1
; Azimuth's settings file (full, or relative to the launcher's folder).
; Default: <launcher>\data\azimuth.ini
AzimuthIni=

[Audio]
; 1: Azimuth's sound settings (audio output, volume) as rows of the game's
; Audio settings page.
Enabled=1

[Captions]
; auto: Polish when the game runs in Polish, Ukrainian when it runs a custom
; Ukrainian language pack in the ru-RU slot, else English. en, pl or uk: always.
Language=auto

[Logging]
; 1: AzimuthGraphicsOptions.log beside the plugin.
Enabled=1
