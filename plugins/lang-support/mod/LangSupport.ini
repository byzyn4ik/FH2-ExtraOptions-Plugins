; Language Support for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts.

[LangSupport]
; The language pack: the name of its folder in mods\ (the folder holds
; language.ini and media\). Empty: the one folder in mods\ that holds a
; language.ini.
Pack=
; 1: subtitles for spoken lines the game shows none for (Ben, Ashley, ANNA),
; from the pack's VoiceSubtitles.str, while the game runs in the pack's slot.
; 0: off (the pack's files are still used: Extra Options mounts them).
VoiceSubtitles=1
