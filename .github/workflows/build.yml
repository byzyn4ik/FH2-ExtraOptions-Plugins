name: build

# Every push and pull request: build every plugin (plugins/*/) with Zig 0.15.2
# and run the offline tests (those that need the game's files, Azimuth's ZIPs
# or Extra Options' release skip themselves here, as does the all-plugins
# test). The artifact FH2-ExtraOptions-Plugins holds the plugins' mod
# folders, flat (unpack it into mods\); the release ZIPs go to release-zips. A pushed tag v*
# (e.g. v1.0.0) also publishes a GitHub release with one ZIP per plugin
# (<id>-<version>.zip, holding mods/<Mod Name>/..., which Forza Horizon 2
# Builder downloads) and the all-in-one FH2-ExtraOptions-Plugins-<version>.zip.
# Asset names use the plugin's id (keyboard-mouse-1.0.0.zip), never its mod
# name ("Keyboard & Mouse" is only the folder inside the ZIP).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.15.2
  # SHA-256 of the official zig-x86_64-windows-0.15.2.zip.
  ZIG_SHA256: 3A0ED1E8799A2F8CE2A6E6290A9FF22E6906F8227865911FB7DDEDC3CC14CB0C

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          $name = "zig-x86_64-windows-$env:ZIG_VERSION"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne $env:ZIG_SHA256) { throw 'Zig download hash mismatch' }
          Expand-Archive zig.zip $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP\$name\zig.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test
        shell: pwsh
        run: |
          $version = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = @('--version', $env:GITHUB_REF_NAME.Substring(1)) }
          python build.py --zig $env:ZIG --all --test --output out @version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the release ZIPs
        shell: pwsh
        run: |
          # One <id>-<version>.zip per plugins/<id>/ (the name Forza Horizon 2 Builder looks for), holding
          # mods/<Mod Name>/mod.json, and the all-in-one ZIP.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($plugin in Get-ChildItem plugins -Directory) {
            if (-not (Test-Path "$($plugin.FullName)/mod/mod.json")) { continue }
            $mod = Get-Content "$($plugin.FullName)/mod/mod.json" -Raw | ConvertFrom-Json
            $name = "$($mod.id)-$($mod.version).zip"
            if ($name -notmatch '^[a-z0-9-]+-[0-9][0-9.]*\.zip$') { throw "bad asset name $name" }
            $zip = Join-Path out/release $name
            if (-not (Test-Path -LiteralPath $zip)) { throw "missing $zip" }
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
            $entries = @($archive.Entries | ForEach-Object FullName)
            $archive.Dispose()
            if ($entries -notcontains "mods/$($mod.name)/mod.json") { throw "$name has no mods/$($mod.name)/mod.json" }
            "${name}: mods/$($mod.name)/ ($($entries.Count) files)"
          }
          if (-not (Get-ChildItem out/release -Filter 'FH2-ExtraOptions-Plugins-*.zip')) { throw 'no all-in-one ZIP' }
      # The artifact to download and use: one flat folder per plugin (the mod
      # folders of out/mods), to unpack into the mods folder beside Azimuth.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: FH2-ExtraOptions-Plugins
          path: out/mods/
          retention-days: 30
      # The release ZIPs, for the release job.
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: out/release/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "FH2 Extra Options plugins ${TAG#v}" --generate-notes
